# Board: ESP32 DevKit V1 (Espressif)
# Definition: definitions/boards/esp32-devkit-v1/manifest.yaml

esphome:
  name: mirage-m400-controller
  friendly_name: mirage_m400_controller

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Load the custom component from your GitHub repository FIRST
external_components:
  - source: github://letigre2389/mirage-m400-controller-esphome
    components: [mirage_m400]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "mirage-m400-con Fallback Hotspot"
    password: "G2lGXEThtyoL"

captive_portal:

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: send_mirage_command
      variables:
        command: string
      then:
        - lambda: |-
            id(mirage_m400_device)->send_command(command.c_str());
            ESP_LOGI("mirage_service", "Sent command: %s", 
            command.c_str());

ota:

# UART Configuration for RS-232 connection via MAX3232
uart:
  id: mirage_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600

# Initialize the Mirage M400 Hub
mirage_m400:
  uart_id: mirage_uart
  id: mirage_m400_device

# Text sensor for raw serial communication debugging
text_sensor:
  - platform: mirage_m400
    name: "Mirage M-400 Last Response"
    id: mirage_last_response
    mirage_m400_id: mirage_m400_device
    icon: mdi:serial-port

# Zone Power and Mute Controls
switch:
  # Zone 1
  - platform: mirage_m400
    mirage_m400_id: mirage_m400_device
    name: "Zone 1 Power"
    id: zone1_power
    zone: 1
    type: power
    icon: mdi:power
  - platform: mirage_m400
    mirage_m400_id: mirage_m400_device
    name: "Zone 1 Mute"
    id: zone1_mute
    zone: 1
    type: mute
    icon: mdi:volume-off

  # Zone 2
  - platform: mirage_m400
    mirage_m400_id: mirage_m400_device
    name: "Zone 2 Power"
    id: zone2_power
    zone: 2
    type: power
    icon: mdi:power
  - platform: mirage_m400
    mirage_m400_id: mirage_m400_device
    name: "Zone 2 Mute"
    id: zone2_mute
    zone: 2
    type: mute
    icon: mdi:volume-off

  # Zone 3
  - platform: mirage_m400
    mirage_m400_id: mirage_m400_device
    name: "Zone 3 Power"
    id: zone3_power
    zone: 3
    type: power
    icon: mdi:power
  - platform: mirage_m400
    mirage_m400_id: mirage_m400_device
    name: "Zone 3 Mute"
    id: zone3_mute
    zone: 3
    type: mute
    icon: mdi:volume-off

  # Zone 4
  - platform: mirage_m400
    mirage_m400_id: mirage_m400_device
    name: "Zone 4 Power"
    id: zone4_power
    zone: 4
    type: power
    icon: mdi:power
  - platform: mirage_m400
    mirage_m400_id: mirage_m400_device
    name: "Zone 4 Mute"
    id: zone4_mute
    zone: 4
    type: mute
    icon: mdi:volume-off
 # Volume Controls per Zone
number:
  - platform: mirage_m400
    mirage_m400_id: mirage_m400_device
    name: "Zone 1 Volume"
    id: zone1_volume
    zone: 1
    icon: mdi:volume-high
  - platform: mirage_m400
    mirage_m400_id: mirage_m400_device
    name: "Zone 2 Volume"
    id: zone2_volume
    zone: 2
    icon: mdi:volume-high
  - platform: mirage_m400
    mirage_m400_id: mirage_m400_device
    name: "Zone 3 Volume"
    id: zone3_volume
    zone: 3
    icon: mdi:volume-high
  - platform: mirage_m400
    mirage_m400_id: mirage_m400_device
    name: "Zone 4 Volume"
    id: zone4_volume
    zone: 4
    icon: mdi:volume-high
